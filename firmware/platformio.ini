; Curling rock split timer firmware.
; esp32c3: back-line units (ESP32-C3 Super Mini)
; esp32s3: hog-line units and any back-line unit using an S3 board
; native:  host unit tests for the hardware-independent code in lib/

[platformio]
default_envs = esp32c3, esp32s3

[esp32_common]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
build_flags = -Wall

[env:esp32c3]
extends = esp32_common
board = esp32-c3-devkitm-1
; The Super Mini has no USB-serial chip, so route Serial over native USB.
build_flags =
    ${esp32_common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3]
extends = esp32_common
board = esp32-s3-devkitc-1

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=c++17 -Wall -Wextra
