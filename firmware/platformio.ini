; Curling rock split timer firmware.
; esp32c3: back-line units (ESP32-C3 Super Mini)
; esp32s3: hog-line units and any back-line unit using an S3 board (two USB ports)
; esp32s3_usb: the same, for S3 boards with a single USB port
; esp32s3_display: HUB75 panel bring-up test for the hog-line units (#36)
; native:  host unit tests for the hardware-independent code in lib/

[platformio]
default_envs = esp32c3, esp32s3, esp32s3_usb

[esp32_common]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 921600
build_flags = -Wall
; src/display_test is a separate program, built only by esp32s3_display.
build_src_filter = +<*> -<display_test/>

[env:esp32c3]
extends = esp32_common
board = esp32-c3-devkitm-1
; The Super Mini has no USB-serial chip, so route Serial over native USB.
build_flags =
    ${esp32_common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3]
extends = esp32_common
board = esp32-s3-devkitc-1

; Same board family, for S3 boards with a single USB port (native USB, no
; USB-serial chip): routes Serial over native USB like the C3.
[env:esp32s3_usb]
extends = env:esp32s3
build_flags =
    ${esp32_common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Display bring-up test (#36). Wiring is in docs/bench/display.md.
[env:esp32s3_display]
extends = env:esp32s3
build_src_filter = -<*> +<display_test/>
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.0.12
    adafruit/Adafruit GFX Library@1.11.11

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=c++17 -Wall -Wextra
