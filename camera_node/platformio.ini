; PlatformIO configuration for Curling Rock Split Timer — Camera Node
; Board: Freenove ESP32-S3-WROOM CAM (N8R8)

[env:freenove-s3-cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3 with 8MB OPI PSRAM + 8MB flash
board_build.arduino.memory_type = qio_opi
board_build.psram = enabled

; USB CDC for Serial output (built-in USB on Freenove board)
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200

; Camera driver
lib_deps =
    espressif/esp32-camera @ ^2.0.0
